name: ParaRotatingHead
version: 1.0.0
main: me.ihqqq.rotatingheads.RotatingHeadsPlugin
api-version: '1.21'
authors: [ihqqq]
description: Clean, configurable rotating heads for Paper.
softdepend: [PlaceholderAPI, FancyHolograms]
commands:
  prh:
    description: Manage rotating heads
    usage: /prh <reload|list|create|edit|teleport|movehere|delete|benchmark|info>
    permission: rotatingheads.admin
permissions:
  rotatingheads.admin:
    default: op
    description: Full access to rotating head management.