name: ParaRotatingHead
version: '${project.version}'
main: me.ihqqq.rotatingheads.RotatingHeadsPlugin
api-version: '1.21'
authors: [ihqqq]
description: Clean, configurable rotating player heads for Paper.
softdepend: [PlaceholderAPI, FancyHolograms]
commands:
  prh:
    description: Manage rotating heads
    usage: /prh <reload|list|info|near|create|clone|edit|teleport|movehere|center|delete>
    permission: rotatingheads.admin
permissions:
  rotatingheads.admin:
    default: op
    description: Full access to rotating head management.