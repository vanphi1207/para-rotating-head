command:
  usage: "<yellow>/prh reload|list|info|near|create|clone|edit|teleport|movehere|center|delete|benchmark"
  reload: "<green>Rotating heads reloaded."
  no-heads: "<red>No active heads."
  list-header: "<gray>Active heads (<white>{count}</white>): "
  list-entry: "<click:run_command:'/prh teleport {id}'><hover:show_text:'<gray>Click to teleport'><white>{id}</white></hover></click>"
  info: "<gray>ParaRotatingHead: <white>{configured}</white> configured, <white>{indexed}</white> indexed."
  head-info: "<gold>Head <white>{id}</white> <gray>({world} <white>{x}, {y}, {z}</white>)<newline><gray>Scale <white>{scale}</white> | range <white>{range}</white><newline><gray>Rotation Y/X/Z: <white>{speedY}/{speedX}/{speedZ}</white> | bob <white>{bob}</white> every <white>{period}</white> ticks<newline><gray>Interaction: <white>{interaction}</white> | hologram: <white>{hologram}</white> ({provider}, <white>{lines}</white> lines)"
  near-none: "<red>No heads within <white>{radius}</white> blocks."
  near-header: "<gray>Heads within <white>{radius}</white> blocks (<white>{count}</white>):"
  near-entry: "<dark_gray> - <click:run_command:'/prh teleport {id}'><hover:show_text:'<gray>Click to teleport'><white>{id}</white></hover></click> <gray>({distance} blocks)"
  created: "<green>Created <white>{id}</white>."
  cloned: "<green>Cloned <white>{id}</white> to <white>{target}</white>."
  updated: "<green>Updated <white>{id}</white>."
  deleted: "<green>Deleted <white>{id}</white>."
  moved: "<green>Moved <white>{id}</white>."
  teleported: "<green>Teleported to <white>{id}</white>."
  centered: "<green>Centered <white>{id}</white> in its block at <white>{x}, {y}, {z}</white>."
  unknown: "<red>Unknown head: <white>{id}</white>"
  exists: "<red>Head already exists: <white>{id}</white>"
  player-only: "<red>This command requires a player."
  invalid: "<red>Invalid value: {reason}"
  missing-argument: "<red>Missing argument. Usage: <white>{usage}"
  unknown-option: "<red>Unknown option: <white>{option}</white>. Available: <white>{options}"
  benchmark-cleared: "<green>Benchmark cleared."
  benchmark-spawned: "<green>Benchmark spawned <white>{count}</white>."
  link-linked: "<gray>Linked FancyHolograms hologram: <white>{link}</white> <green>(active)</green><gray>, follows the head: <white>{follow}</white>"
  link-waiting: "<gray>Linked FancyHolograms hologram: <white>{link}</white> <yellow>(not active: hologram not found, FancyHolograms unavailable or head not loaded)"
  fancy-missing: "<yellow>FancyHolograms is not installed or not usable, so the link stays inactive."
  link-hologram-disabled: "<yellow>The hologram of this head is disabled. Enable it with <white>/prh edit {id} hologram true</white>."
  no-permission: "<red>You do not have permission to use this command."
validation:
  id: "<red>Invalid value: the id may only contain a-z, 0-9, _ or - (max 32 characters)."
  integer: "<red>Invalid value: must be a whole number."
  number: "<red>Invalid value: must be a number."
  range: "<red>Invalid value: must be between <white>{min}</white> and <white>{max}</white>."
  boolean: "<red>Invalid value: must be <white>true</white> or <white>false</white>."
  brightness: "<red>Invalid value: brightness uses sky/block, e.g. <white>15/15</white>."
  texture: "<red>Invalid texture: use a Base64 value, a textures.minecraft.net URL or a texture hash."
  provider: "<red>Invalid provider. Available: <white>{options}"
  no-lines: "<red>This head has no hologram lines."
  link-name: "<red>Invalid hologram name: use letters, digits, _ . - (max 64), or <white>none</white> to unlink."