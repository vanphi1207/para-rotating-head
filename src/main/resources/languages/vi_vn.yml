prefix: "<dark_gray>[<gold>ParaRotatingHead</gold><dark_gray>]</dark_gray> "
command:
  usage: "<yellow>/prh reload|list|info|near|create|clone|edit|teleport|movehere|center|delete"
  reload: "<green>Đã tải lại các đầu xoay."
  reload-failed: "<red>heads.yml bị lỗi cú pháp nên không thể tải lại. Hãy sửa file rồi thử lại; chưa có gì bị thay đổi."
  no-heads: "<red>Hiện không có đầu xoay nào."
  list-header: "<gray>Danh sách đầu xoay (<white>{count}</white>): "
  list-entry: "<click:run_command:'/prh teleport {id}'><hover:show_text:'<gray>Bấm để dịch chuyển'><white>{id}</white></hover></click>"
  info: "<gray>ParaRotatingHead: <white>{configured}</white> đã cấu hình, <white>{indexed}</white> đã lập chỉ mục."
  head-info: "<gold>Đầu <white>{id}</white> <gray>({world} <white>{x}, {y}, {z}</white>)<newline><gray>Kích thước <white>{scale}</white> | tầm nhìn <white>{range}</white><newline><gray>Tốc độ xoay Y/X/Z: <white>{speedY}/{speedX}/{speedZ}</white> | nhấp nhô <white>{bob}</white> mỗi <white>{period}</white> tick<newline><gray>Tương tác: <white>{interaction}</white> | hologram: <white>{hologram}</white> ({provider}, <white>{lines}</white> dòng)"
  near-none: "<red>Không có đầu xoay nào trong bán kính <white>{radius}</white> block."
  near-header: "<gray>Đầu xoay trong bán kính <white>{radius}</white> block (<white>{count}</white>):"
  near-entry: "<dark_gray> - <click:run_command:'/prh teleport {id}'><hover:show_text:'<gray>Bấm để dịch chuyển'><white>{id}</white></hover></click> <gray>(cách {distance} block)"
  created: "<green>Đã tạo <white>{id}</white>."
  cloned: "<green>Đã nhân bản <white>{id}</white> thành <white>{target}</white>."
  updated: "<green>Đã cập nhật <white>{id}</white>."
  deleted: "<green>Đã xóa <white>{id}</white>."
  moved: "<green>Đã di chuyển <white>{id}</white> đến vị trí của bạn."
  teleported: "<green>Đã dịch chuyển đến <white>{id}</white>."
  centered: "<green>Đã căn <white>{id}</white> vào giữa block tại <white>{x}, {y}, {z}</white>."
  unknown: "<red>Không tìm thấy đầu xoay: <white>{id}</white>."
  exists: "<red>Đầu xoay đã tồn tại: <white>{id}</white>."
  player-only: "<red>Lệnh này chỉ dành cho người chơi."
  invalid: "<red>Giá trị không hợp lệ: {reason}."
  missing-argument: "<red>Thiếu tham số. Cách dùng: <white>{usage}"
  unknown-option: "<red>Tùy chọn không hợp lệ: <white>{option}</white>. Các tùy chọn: <white>{options}"
  link-linked: "<gray>Đã liên kết hologram FancyHolograms: <white>{link}</white> <green>(đang hoạt động)</green><gray>, đi theo đầu xoay: <white>{follow}</white>."
  link-waiting: "<gray>Đã liên kết hologram FancyHolograms: <white>{link}</white> <yellow>(chưa hoạt động: không tìm thấy hologram, FancyHolograms không dùng được hoặc đầu xoay chưa được tải).</yellow>"
  fancy-missing: "<yellow>FancyHolograms chưa được cài hoặc không dùng được nên liên kết chưa hoạt động."
  link-hologram-disabled: "<yellow>Hologram của đầu xoay này đang tắt. Bật bằng <white>/prh edit {id} hologram true</white>."
  no-permission: "<red>Bạn không có quyền dùng lệnh này."
validation:
  id: "<red>Giá trị không hợp lệ: id chỉ được chứa a-z, 0-9, _ hoặc - (tối đa 32 ký tự)."
  integer: "<red>Giá trị không hợp lệ: phải là số nguyên."
  number: "<red>Giá trị không hợp lệ: phải là một số."
  range: "<red>Giá trị không hợp lệ: phải nằm trong khoảng <white>{min}</white> đến <white>{max}</white>."
  boolean: "<red>Giá trị không hợp lệ: phải là <white>true</white> hoặc <white>false</white>."
  brightness: "<red>Giá trị không hợp lệ: độ sáng dùng dạng sky/block, ví dụ <white>15/15</white>."
  texture: "<red>Texture không hợp lệ: dùng giá trị Base64, URL textures.minecraft.net hoặc mã hash của texture."
  provider: "<red>Provider không hợp lệ. Các lựa chọn: <white>{options}"
  no-lines: "<red>Đầu xoay này chưa có dòng hologram nào."
  link-name: "<red>Tên hologram không hợp lệ: chỉ dùng chữ, số, _ . - (tối đa 64), hoặc <white>none</white> để bỏ liên kết."